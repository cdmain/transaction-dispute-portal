# ══════════════════════════════════════════════════════════════════════════════
# Multi-Environment Deployment Pipeline (gh-pages branch strategy)
# ══════════════════════════════════════════════════════════════════════════════
#
# HOW IT WORKS:
# - All environments are deployed to the gh-pages branch
# - Each source branch updates ONLY its target environment(s)
# - Existing environments are preserved when not being updated
#
# BRANCHING STRATEGY:
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  dev branch     → Updates DEV + INT folders on gh-pages                     │
# │  release/*      → Updates QA folder on gh-pages                             │
# │  main branch    → Updates PROD folder on gh-pages                           │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# URLS:
# • Landing: https://cdmain.github.io/transaction-dispute-portal/
# • DEV:     https://cdmain.github.io/transaction-dispute-portal/dev/
# • INT:     https://cdmain.github.io/transaction-dispute-portal/int/
# • QA:      https://cdmain.github.io/transaction-dispute-portal/qa/
# • PROD:    https://cdmain.github.io/transaction-dispute-portal/prod/
#
# ══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  push:
    branches: 
      - dev
      - main
      - 'release/*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev-int
          - qa
          - prod
          - all

permissions:
  contents: write

env:
  BUN_VERSION: 'latest'

jobs:
  deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine environments to deploy
        id: env
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "🌿 Source branch: $BRANCH"
          
          # Manual dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              dev-int) echo "envs=dev int" >> $GITHUB_OUTPUT ;;
              qa) echo "envs=qa" >> $GITHUB_OUTPUT ;;
              prod) echo "envs=prod" >> $GITHUB_OUTPUT ;;
              all) echo "envs=dev int qa prod" >> $GITHUB_OUTPUT ;;
            esac
            exit 0
          fi
          
          # Branch-based
          if [[ "$BRANCH" == "dev" ]]; then
            echo "envs=dev int" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == release/* ]]; then
            echo "envs=qa" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "main" ]]; then
            echo "envs=prod" >> $GITHUB_OUTPUT
          else
            echo "envs=" >> $GITHUB_OUTPUT
          fi

      - name: Get version
        id: version
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}-${COMMIT}" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Checkout gh-pages (existing site)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          # Copy existing site if it exists
          if [ -d "gh-pages-existing" ]; then
            cp -r gh-pages-existing/* deploy/ 2>/dev/null || true
            rm -rf gh-pages-existing
          fi

      - name: 🟢 Build DEV
        if: contains(steps.env.outputs.envs, 'dev')
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'dev'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}-dev

      - name: Deploy DEV
        if: contains(steps.env.outputs.envs, 'dev')
        run: |
          rm -rf deploy/dev
          mkdir -p deploy/dev
          cp -r frontend/dist/* deploy/dev/
          echo "✅ DEV environment updated"

      - name: 🔵 Build INT
        if: contains(steps.env.outputs.envs, 'int')
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'int'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}-int

      - name: Deploy INT
        if: contains(steps.env.outputs.envs, 'int')
        run: |
          rm -rf deploy/int
          mkdir -p deploy/int
          cp -r frontend/dist/* deploy/int/
          echo "✅ INT environment updated"

      - name: 🟡 Build QA
        if: contains(steps.env.outputs.envs, 'qa')
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'qa'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}-qa

      - name: Deploy QA
        if: contains(steps.env.outputs.envs, 'qa')
        run: |
          rm -rf deploy/qa
          mkdir -p deploy/qa
          cp -r frontend/dist/* deploy/qa/
          echo "✅ QA environment updated"

      - name: 🔴 Build PROD
        if: contains(steps.env.outputs.envs, 'prod')
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'prod'
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Deploy PROD
        if: contains(steps.env.outputs.envs, 'prod')
        run: |
          rm -rf deploy/prod
          mkdir -p deploy/prod
          cp -r frontend/dist/* deploy/prod/
          echo "✅ PROD environment updated"

      - name: Create landing page
        run: |
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Transaction Dispute Portal</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1e3a5f, #0f2840); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
              .container { text-align: center; color: white; max-width: 900px; }
              h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
              .subtitle { opacity: 0.8; margin-bottom: 2rem; }
              .environments { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
              .env-card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 1.5rem; text-decoration: none; color: white; transition: all 0.3s; }
              .env-card:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
              .env-card.dev { border: 2px solid #22c55e; }
              .env-card.int { border: 2px solid #3b82f6; }
              .env-card.qa { border: 2px solid #f59e0b; }
              .env-card.prod { border: 2px solid #ef4444; }
              .env-name { font-size: 1.25rem; font-weight: 600; }
              .env-desc { font-size: 0.875rem; opacity: 0.7; }
              .info { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 1rem; margin-top: 2rem; font-size: 0.875rem; }
              .creds { font-family: monospace; color: #22c55e; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🏦 Transaction Dispute Portal</h1>
              <p class="subtitle">Select an environment</p>
              <div class="environments">
                <a href="./dev/" class="env-card dev"><div class="env-name">🟢 DEV</div><div class="env-desc">Development</div></a>
                <a href="./int/" class="env-card int"><div class="env-name">🔵 INT</div><div class="env-desc">Integration</div></a>
                <a href="./qa/" class="env-card qa"><div class="env-name">🟡 QA</div><div class="env-desc">Quality Assurance</div></a>
                <a href="./prod/" class="env-card prod"><div class="env-name">🔴 PROD</div><div class="env-desc">Production</div></a>
              </div>
              <div class="info">Demo: <span class="creds">demo@example.com / Demo123!</span></div>
            </div>
          </body>
          </html>
          EOF
          touch deploy/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Deploy: ${{ steps.env.outputs.envs }} from ${{ github.ref_name }}"
