# ══════════════════════════════════════════════════════════════════════════════
# Multi-Environment Deployment Pipeline
# ══════════════════════════════════════════════════════════════════════════════
#
# BRANCHING STRATEGY:
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  feature/* branches                                                          │
# │  └── PR → dev branch (code review required)                                 │
# │                                                                              │
# │  dev branch                                                                  │
# │  └── Push → Auto-deploy to DEV and INT environments                        │
# │                                                                              │
# │  release/* branches                                                          │
# │  └── Created from dev → Auto-deploy to QA                                   │
# │  └── PR → main (requires approval) → Deploy to PROD                        │
# │                                                                              │
# │  main branch                                                                 │
# │  └── Only receives merges from release/* branches                          │
# │  └── Push → Deploy to PROD                                                 │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ENVIRONMENTS:
# • DEV  - /dev/   - Latest dev branch (auto-deploy)
# • INT  - /int/   - Integration testing (auto-deploy with dev)
# • QA   - /qa/    - Release candidate testing (release/* branches)
# • PROD - /prod/  - Stable production (main branch only)
#
# URLS:
# • Landing: https://cdmain.github.io/transaction-dispute-portal/
# • DEV:     https://cdmain.github.io/transaction-dispute-portal/dev/
# • INT:     https://cdmain.github.io/transaction-dispute-portal/int/
# • QA:      https://cdmain.github.io/transaction-dispute-portal/qa/
# • PROD:    https://cdmain.github.io/transaction-dispute-portal/prod/
#
# ══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  push:
    branches: 
      - dev
      - main
      - 'release/*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev-int
          - qa
          - prod
          - all

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUN_VERSION: 'latest'

jobs:
  setup:
    name: 🔍 Determine Deployment
    runs-on: ubuntu-latest
    outputs:
      deploy_dev: ${{ steps.check.outputs.deploy_dev }}
      deploy_int: ${{ steps.check.outputs.deploy_int }}
      deploy_qa: ${{ steps.check.outputs.deploy_qa }}
      deploy_prod: ${{ steps.check.outputs.deploy_prod }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}-${COMMIT_SHORT}" >> $GITHUB_OUTPUT

      - name: Check deployment targets
        id: check
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "🌿 Branch: $BRANCH"
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.environment }}" in
              dev-int)
                echo "deploy_dev=true" >> $GITHUB_OUTPUT
                echo "deploy_int=true" >> $GITHUB_OUTPUT
                echo "deploy_qa=false" >> $GITHUB_OUTPUT
                echo "deploy_prod=false" >> $GITHUB_OUTPUT
                ;;
              qa)
                echo "deploy_dev=false" >> $GITHUB_OUTPUT
                echo "deploy_int=false" >> $GITHUB_OUTPUT
                echo "deploy_qa=true" >> $GITHUB_OUTPUT
                echo "deploy_prod=false" >> $GITHUB_OUTPUT
                ;;
              prod)
                echo "deploy_dev=false" >> $GITHUB_OUTPUT
                echo "deploy_int=false" >> $GITHUB_OUTPUT
                echo "deploy_qa=false" >> $GITHUB_OUTPUT
                echo "deploy_prod=true" >> $GITHUB_OUTPUT
                ;;
              all)
                echo "deploy_dev=true" >> $GITHUB_OUTPUT
                echo "deploy_int=true" >> $GITHUB_OUTPUT
                echo "deploy_qa=true" >> $GITHUB_OUTPUT
                echo "deploy_prod=true" >> $GITHUB_OUTPUT
                ;;
            esac
            exit 0
          fi
          
          if [[ "$BRANCH" == "dev" ]]; then
            echo "📦 Dev branch → Deploying to DEV + INT"
            echo "deploy_dev=true" >> $GITHUB_OUTPUT
            echo "deploy_int=true" >> $GITHUB_OUTPUT
            echo "deploy_qa=false" >> $GITHUB_OUTPUT
            echo "deploy_prod=false" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == release/* ]]; then
            echo "📦 Release branch → Deploying to QA"
            echo "deploy_dev=false" >> $GITHUB_OUTPUT
            echo "deploy_int=false" >> $GITHUB_OUTPUT
            echo "deploy_qa=true" >> $GITHUB_OUTPUT
            echo "deploy_prod=false" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "main" ]]; then
            echo "📦 Main branch → Deploying to PROD"
            echo "deploy_dev=false" >> $GITHUB_OUTPUT
            echo "deploy_int=false" >> $GITHUB_OUTPUT
            echo "deploy_qa=false" >> $GITHUB_OUTPUT
            echo "deploy_prod=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_dev=false" >> $GITHUB_OUTPUT
            echo "deploy_int=false" >> $GITHUB_OUTPUT
            echo "deploy_qa=false" >> $GITHUB_OUTPUT
            echo "deploy_prod=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🔨 Build Environments
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile || bun install

      - name: Create dist directory
        run: mkdir -p dist

      - name: 🟢 Build DEV
        if: needs.setup.outputs.deploy_dev == 'true'
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'dev'
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}-dev

      - name: Move DEV build
        if: needs.setup.outputs.deploy_dev == 'true'
        run: mkdir -p dist/dev && cp -r frontend/dist/* dist/dev/

      - name: 🔵 Build INT
        if: needs.setup.outputs.deploy_int == 'true'
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'int'
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}-int

      - name: Move INT build
        if: needs.setup.outputs.deploy_int == 'true'
        run: mkdir -p dist/int && cp -r frontend/dist/* dist/int/

      - name: 🟡 Build QA
        if: needs.setup.outputs.deploy_qa == 'true'
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'qa'
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}-qa

      - name: Move QA build
        if: needs.setup.outputs.deploy_qa == 'true'
        run: mkdir -p dist/qa && cp -r frontend/dist/* dist/qa/

      - name: 🔴 Build PROD
        if: needs.setup.outputs.deploy_prod == 'true'
        working-directory: frontend
        run: bun run build
        env:
          VITE_DEMO_MODE: 'true'
          VITE_ENVIRONMENT: 'prod'
          VITE_APP_VERSION: ${{ needs.setup.outputs.version }}

      - name: Move PROD build
        if: needs.setup.outputs.deploy_prod == 'true'
        run: mkdir -p dist/prod && cp -r frontend/dist/* dist/prod/

      - name: Create Landing Page
        run: |
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Transaction Dispute Portal</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, #1e3a5f, #0f2840); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
              .container { text-align: center; color: white; max-width: 900px; }
              h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
              .subtitle { opacity: 0.8; margin-bottom: 2rem; }
              .environments { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
              .env-card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 1.5rem; text-decoration: none; color: white; transition: all 0.3s; }
              .env-card:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
              .env-card.dev { border: 2px solid #22c55e; }
              .env-card.int { border: 2px solid #3b82f6; }
              .env-card.qa { border: 2px solid #f59e0b; }
              .env-card.prod { border: 2px solid #ef4444; }
              .env-name { font-size: 1.25rem; font-weight: 600; }
              .env-desc { font-size: 0.875rem; opacity: 0.7; }
              .info { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 1rem; margin-top: 2rem; font-size: 0.875rem; }
              .creds { font-family: monospace; color: #22c55e; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🏦 Transaction Dispute Portal</h1>
              <p class="subtitle">Select an environment</p>
              <div class="environments">
                <a href="./dev/" class="env-card dev"><div class="env-name">🟢 DEV</div><div class="env-desc">Development</div></a>
                <a href="./int/" class="env-card int"><div class="env-name">🔵 INT</div><div class="env-desc">Integration</div></a>
                <a href="./qa/" class="env-card qa"><div class="env-name">🟡 QA</div><div class="env-desc">Quality Assurance</div></a>
                <a href="./prod/" class="env-card prod"><div class="env-name">🔴 PROD</div><div class="env-desc">Production</div></a>
              </div>
              <div class="info">Demo: <span class="creds">demo@example.com / Demo123!</span></div>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    name: 🚀 Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
